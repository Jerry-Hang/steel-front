[package]
name = "steel-front"
version = "0.1.0"
description = "钢铁前线 (Steel Front) - 21 世纪架空世界观大战场 FPS 引擎"
edition = "2021"

[dependencies]
# Vulkan 绑定
ash = { version = "0.38", features = ["debug"] }
# Vulkan 窗口表面创建
ash-window = "0.13"
# 窗口管理（使用 rwh_06 以匹配 ash-window 0.13）
winit = { version = "0.30", features = ["rwh_06"] }
# 线性代数（向量、矩阵）
glam = "0.29"
# 原始窗口句柄（vulkan 需要，rwh_06 以匹配 ash-window）
raw-window-handle = "0.6"
# 日志
log = "0.4"
env_logger = "0.11"
# 图片解码（PNG 等本地贴图加载）
image = "0.25"

[build-dependencies]
# 编译 WGSL 着色器为 SPIR-V（构建时）
naga = { version = "30", features = ["wgsl-in", "spv-out", "spv-in"] }
rspirv = "0.11"

# ---------------------------------------------------------------------------
# 2026-09-08：项目第一次系统性跑 clippy（此前没有 CI、没有 lint 配置，从没跑过）。
# 存量 120+ 条几乎全是风格类（field_reassign_with_default、needless_borrow、
# manual_is_multiple_of、doc_lazy_continuation、type_complexity、manual_div_ceil、
# unnecessary_cast …）。逐条改写在一部手调过的 Vulkan 渲染器上是纯 churn，且改完
# 没有回归网兜着；所以这里定**明确策略**，而不是往源码里撒 #[allow] 把问题藏起来：
#
#   correctness / suspicious → deny：真 bug 一律拦在编译期。首轮已按此清掉两条
#     deny 级 error（main.rs 的 MAX_FPS>0 恒假比较、geom.rs 的 e 近似值字面量），
#     以及 same_item_push / nonminimal_bool / let_unit_value / collapsible_match /
#     items_after_test_module 这些**可能藏真问题**的，全部人工核对后改掉了。
#   style / complexity / perf  → allow：想清理时临时
#     `cargo clippy -- -W clippy::style` 分批做，不作为常态门禁。
#
# `unused` 组（cargo 那 51 条警告的来源）保持默认的 warn，不动——它刚被清零，
# 再堆回来要能看见。
# ---------------------------------------------------------------------------
[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
