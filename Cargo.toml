[package]
name = "steel-front"
version = "0.1.0"
description = "钢铁前线 (Steel Front) - 21 世纪架空世界观大战场 FPS 引擎"
edition = "2021"

# 库目标：桌面给薄 bin 用（rlib）；Android 编 cdylib（.so）以导出 android_main。
[lib]
name = "steel_front"
crate-type = ["rlib", "cdylib"]
# 本仓原为纯 bin crate，从未跑过 doctest；doc 注释里的代码块是示例（如 RV3D_* 用法），
# 不是可执行判据。改成 lib 后 `cargo test` 会默认跑 doctest ⇒ 显式关掉，保持与 bin 时期一致。
doctest = false

[dependencies]
# Vulkan 绑定
ash = { version = "0.38", features = ["debug"] }
# Vulkan 窗口表面创建
ash-window = "0.13"
# 窗口管理（使用 rwh_06 以匹配 ash-window 0.13）
winit = { version = "0.30", features = ["rwh_06", "android-game-activity"] }
# ⚠ 上面的 android-game-activity 仅在 **Android 目标**下拉入传递依赖
#   android-activity / ndk / ndk-sys / jni / jni-sys / android-properties / ndk-context 等
#   （全集与理由见 AGENTS.md 的「不新增第三方依赖」例外段）。桌面构建图不受影响。
# 线性代数（向量、矩阵）
glam = "0.29"
# 原始窗口句柄（vulkan 需要，rwh_06 以匹配 ash-window）
raw-window-handle = "0.6"
# 日志
log = "0.4"
env_logger = "0.11"
# 图片解码（PNG 等本地贴图加载）
image = "0.25"

# Android 专属直接依赖：AAssetManager（AssetSource 的第三实现用）。
# ⚠ 只在 Android 目标下拉入 ⇒ 桌面直接依赖数不变（仍 10 个）。
[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9"

[build-dependencies]
# 编译 WGSL 着色器为 SPIR-V（构建时）
naga = { version = "30", features = ["wgsl-in", "spv-out", "spv-in"] }
rspirv = "0.11"

# ---------------------------------------------------------------------------
# 2026-09-08：项目第一次系统性跑 clippy（此前没有 CI、没有 lint 配置，从没跑过）。
# 存量 120+ 条几乎全是风格类（field_reassign_with_default、needless_borrow、
# manual_is_multiple_of、doc_lazy_continuation、type_complexity、manual_div_ceil、
# unnecessary_cast …）。逐条改写在一部手调过的 Vulkan 渲染器上是纯 churn，且改完
# 没有回归网兜着；所以这里定**明确策略**，而不是往源码里撒 #[allow] 把问题藏起来：
#
#   correctness / suspicious → deny：真 bug 一律拦在编译期。首轮已按此清掉两条
#     deny 级 error（main.rs 的 MAX_FPS>0 恒假比较、geom.rs 的 e 近似值字面量），
#     以及 same_item_push / nonminimal_bool / let_unit_value / collapsible_match /
#     items_after_test_module 这些**可能藏真问题**的，全部人工核对后改掉了。
#   style / complexity / perf  → allow：想清理时临时
#     `cargo clippy -- -W clippy::style` 分批做，不作为常态门禁。
#
# `unused` 组（cargo 那 51 条警告的来源）保持默认的 warn，不动——它刚被清零，
# 再堆回来要能看见。
# ---------------------------------------------------------------------------
[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }

# ---------------------------------------------------------------------------
# 2026-09-22 复查：把 release 的两个开关**写出来**，不靠"默认值"这种隐性知识。
#   - debug-assertions = false ⇒ `debug_assert!` 在 release 里**根本不存在**。
#     当天修的那条 cull 段数越界就是这么埋进去的：`debug_assert!(nw <= 64)` 看着像护栏，
#     而发布版里它是空的（64 worker 以上的机器每帧 index out of bounds）。
#   - overflow-checks = false ⇒ 无符号减法**静默回绕**（`0usize - 1 == usize::MAX`）。
#     ⇒ 无符号计数器一律 `saturating_sub` 或先判 0；关键路径已逐个核过（见 PROGRESS）。
# 这两个值就是 cargo 的 release 默认值，写出来**不改变任何行为**，只把决策留在仓库里。
# ---------------------------------------------------------------------------
[profile.release]
debug-assertions = false
overflow-checks = false
