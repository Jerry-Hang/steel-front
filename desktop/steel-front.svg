<?xml version="1.0" encoding="UTF-8"?>
<!--
  Steel Front 图标（Linux 桌面集成用）

  设计约束（照着"小尺寸要能认出来"倒推）：
    * 只用**一个**视觉母题 —— 准星。16px 下还能分辨；堆细节会在小尺寸糊成一团。
    * 冷灰钢底 + 琥珀色准星：与游戏美术基调（2020s 东欧/中东战乱城镇、冷灰色调）一致，
      同时保证图标在任何壁纸上都有对比度。
    * 圆角矩形自带"应用图标"的形状语言，不依赖主题给外框。
    * 纯矢量、无外部引用、无字体依赖（字体在不同机器上不一定有，一缺就变成方框）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5560"/>
      <stop offset="0.55" stop-color="#2b333c"/>
      <stop offset="1" stop-color="#161b21"/>
    </linearGradient>
    <!-- 🔴 `gradientUnits="userSpaceOnUse"` 不能省：默认的 objectBoundingBox 用的是
         **每个图形自己的包围盒**，而一条水平线的包围盒**高度为 0** ⇒ 渐变退化 ⇒
         描边整个画不出来（实测：四段准星臂全丢，只剩有点/环的那两个图形）。
         改成绝对坐标后所有图形共用一个坐标系，形状与渐变都正常。 -->
    <linearGradient id="amber" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="0" y2="256">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
  </defs>

  <!-- 钢底板：圆角矩形 + 顶部一道高光，暗示金属 -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#steel)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="none"
        stroke="#5d6b78" stroke-width="4"/>
  <path d="M60 34 H196" stroke="#7d8b98" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- 准星：四段断开的十字（断口是刻意的 —— 连起来会在小尺寸糊成加号） -->
  <g stroke="url(#amber)" stroke-width="13" stroke-linecap="round">
    <path d="M128 40 V84"/>
    <path d="M128 172 V216"/>
    <path d="M40 128 H84"/>
    <path d="M172 128 H216"/>
  </g>

  <!-- 中心点 + 外圈：给出"瞄准"的层次 -->
  <circle cx="128" cy="128" r="11" fill="url(#amber)"/>
  <circle cx="128" cy="128" r="34" fill="none" stroke="url(#amber)"
          stroke-width="9" opacity="0.85"/>
</svg>
